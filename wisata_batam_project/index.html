<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<title>Hallo Batam AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet">

<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

<style>
:root{
  --green:#087f5b;
  --green-dark:#056347;
  --mint:#eaf6ef;
  --ink:#172e26;
  --muted:#62736c;
  --line:#e3ebe6;
  --bg:#f6f9f6;
  --white:#fff;
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;color:var(--ink);background:#eaf0eb}
body{font-family:"Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button,a,input,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--green)}
button,a{touch-action:manipulation}
:focus-visible{outline:3px solid #e3ab36;outline-offset:4px}
button:active:not(:disabled){transform:translateY(1px)}

.icon{
  font-family:"Material Symbols Outlined";
  font-weight:400;font-style:normal;font-size:23px;
  line-height:1;display:inline-block;white-space:nowrap;
  font-feature-settings:"liga";-webkit-font-smoothing:antialiased;
}
.app{
  max-width:1000px;margin:auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--bg);
  overflow:hidden;box-shadow:0 0 70px #193d2010;
}

/* Header tanpa logo */
.header{
  padding:16px 24px;
  padding-top:max(16px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;background:white;border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.hello-brand{flex:1;min-width:0}
.hello-brand-title{display:flex;align-items:center;gap:8px}
.hello-brand-name{
  color:var(--ink);font-size:20px;font-weight:800;
  line-height:1.2;letter-spacing:-.7px;
}
.hello-ai-badge{
  display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;padding:4px 6px;border:1px solid #d8ebdf;
  border-radius:6px;background:var(--mint);color:var(--green);
  font-size:10px;font-weight:800;line-height:1;letter-spacing:.3px;
}
.hello-brand-subtitle{
  display:block;margin-top:5px;color:var(--muted);
  font-size:11px;font-weight:400;line-height:1.5;
}
.language{
  display:flex;flex-shrink:0;align-self:center;padding:4px;
  border:1px solid var(--line);border-radius:14px;background:var(--bg);
}
.language button{
  background:none;color:var(--muted);font-size:12px;font-weight:700;
  min-width:40px;min-height:40px;padding:0 10px;border-radius:10px;
}
.language button[aria-pressed=true]{
  background:white;color:var(--green);
  box-shadow:0 2px 6px rgba(23,46,38,.08);
}
.brand-mark{
  width:42px;height:42px;display:grid;place-items:center;
  background:var(--green);color:white;border-radius:14px;
}

main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.page{max-width:780px;margin:auto;padding:28px 24px 36px}
.eyebrow{
  font-size:11px;letter-spacing:1.7px;text-transform:uppercase;
  font-weight:800;color:var(--green);margin:0 0 10px;
}
h1,h2,h3,p{margin-top:0}
h1{
  font-size:clamp(30px,5vw,44px);line-height:1.12;
  letter-spacing:-1.7px;margin-bottom:14px;
}
h2{font-size:27px;letter-spacing:-1px;line-height:1.2;margin-bottom:10px}
h3{font-size:17px;letter-spacing:-.3px;margin-bottom:8px}
p{font-size:14px;line-height:1.75}
.muted{color:var(--muted)}
.small{font-size:12px}

.hero{
  min-height:230px;position:relative;border-radius:var(--radius);
  overflow:hidden;background:linear-gradient(135deg,#24664a,#91bca6);
  margin-bottom:26px;
}
.hero img{position:absolute;width:100%;height:100%;object-fit:cover}
.hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,#092a27ba,transparent 80%);
}
.hero-caption{
  position:absolute;z-index:1;bottom:22px;
  left:22px;right:22px;color:white;
}
.hero-caption p{font-size:12px;color:#ffffffd9;margin:7px 0 0}
.tag{
  display:inline-flex;align-items:center;gap:6px;border-radius:30px;
  font-size:11px;font-weight:600;padding:7px 11px;
  background:var(--mint);color:var(--green);
}
.hero .tag{background:#ffffff26;color:white;backdrop-filter:blur(8px)}
.hero-caption strong{
  display:block;font-size:26px;letter-spacing:-.8px;margin-top:10px;
}
.button{
  display:inline-flex;align-items:center;justify-content:center;
  gap:9px;min-height:48px;padding:12px 18px;border-radius:14px;
  font-size:13px;font-weight:700;text-decoration:none;line-height:1.4;
}
.primary{background:var(--green);color:white}
.primary:hover:not(:disabled){background:var(--green-dark)}
.secondary{background:white;color:var(--green);border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .button{flex:1}
.section-heading{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin:28px 0 14px;
}
.section-heading h3{margin:0}
.text-button{
  background:transparent;color:var(--green);font-size:12px;
  font-weight:700;min-height:44px;padding:8px;
}
.prompt-list{display:grid;gap:10px}
.prompt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px;background:white;border:1px solid var(--line);
  border-radius:16px;color:var(--ink);
}
.prompt:hover{border-color:#8dc4aa}
.prompt>span:nth-child(2){flex:1;font-size:13px;font-weight:600;line-height:1.5}
.prompt-icon{
  width:39px;height:39px;background:var(--mint);color:var(--green);
  display:grid;place-items:center;border-radius:12px;flex-shrink:0;
}
.prompt:nth-child(2) .prompt-icon{background:#edf2ff;color:#536cbd}
.prompt:nth-child(3) .prompt-icon{background:#fff4df;color:#aa7014}
.arrow{font-size:19px;color:#82968c}
.note{
  padding:16px;border:1px solid var(--line);border-radius:16px;
  background:white;color:var(--muted);font-size:12px;
  line-height:1.7;margin-top:20px;
}

/* Empat mitra tetap sejajar */
.partners{
  margin-top:24px;padding:22px 16px;background:white;
  border:1px solid var(--line);border-radius:20px;
}
.partners-title{
  text-align:center;font-size:12px;font-weight:700;
  color:var(--muted);letter-spacing:.5px;margin:0 0 18px;
}
.partner-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;list-style:none;margin:0;padding:0;
}
.partner-item{
  min-width:0;display:flex;flex-direction:column;
  align-items:center;gap:10px;text-align:center;
}
.partner-image{
  width:100%;max-width:100px;height:68px;
  display:flex;align-items:center;justify-content:center;
}
.partner-image img{
  display:block;max-width:100%;width:100%;height:100%;object-fit:contain;
}
.partner-name{
  font-size:11px;font-weight:600;color:var(--muted);line-height:1.4;
}

.nav{
  display:flex;flex-shrink:0;background:white;
  border-top:1px solid var(--line);
  padding:8px 8px max(8px,env(safe-area-inset-bottom));gap:4px;
}
.nav button{
  flex:1;min-width:0;min-height:55px;border-radius:13px;
  background:transparent;color:var(--muted);display:flex;
  flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:10px;font-weight:600;
}
.nav button[aria-current=page]{color:var(--green);background:var(--mint)}
.nav .icon{font-size:22px}
.page-top{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:22px;
}
.page-top h2{margin:0;font-size:23px}
.icon-button{
  display:inline-grid;place-items:center;min-width:44px;
  min-height:44px;border-radius:13px;background:white;
  border:1px solid var(--line);color:var(--green);
}
.chat-empty{text-align:center;padding:32px 0 20px}
.chat-empty .brand-mark{
  margin:0 auto 18px;width:60px;height:60px;border-radius:20px;
}
.chat-empty h2{font-size:25px}
.chat-empty p{max-width:390px;margin:0 auto 23px}
.chat-empty .prompt-list{text-align:left;max-width:440px;margin:auto}
.messages{
  display:flex;flex-direction:column;gap:24px;min-width:0;width:100%;
}
.message{max-width:100%;min-width:0;align-self:flex-start}
.message.assistant{width:100%}
.message.user{align-self:flex-end;max-width:85%}
.bubble,.answer{min-width:0;max-width:100%}
.message-label{
  display:block;font-size:11px;color:var(--muted);
  margin:0 0 8px 3px;font-weight:600;
}
.bubble{
  padding:16px 18px;background:white;border:1px solid var(--line);
  border-radius:4px 19px 19px 19px;font-size:14px;
  line-height:1.8;overflow-wrap:anywhere;
}
.user .bubble{
  background:var(--green);color:white;border:0;
  border-radius:19px 4px 19px 19px;white-space:pre-wrap;
}
.answer{overflow-wrap:anywhere}
.answer p{margin:0 0 12px}
.answer p:last-child{margin-bottom:0}
.answer ul,.answer ol{padding-left:22px}
.answer pre{
  overflow:auto;background:var(--bg);padding:12px;border-radius:8px;
}

/* Scroll hanya di tabel */
.table-scroll{
  display:block;width:100%;max-width:100%;min-width:0;
  overflow-x:auto;overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:12px;margin:12px 0 8px;
  scrollbar-width:thin;scrollbar-color:#8bb9a3 var(--mint);
}
.table-scroll:focus-visible{
  outline:2px solid var(--green);outline-offset:2px;
}
.answer .table-scroll table{
  width:100%;min-width:560px;margin:0;border-collapse:separate;
  border-spacing:0;table-layout:auto;font-size:13px;line-height:1.6;
}
.answer .table-scroll th,
.answer .table-scroll td{
  padding:12px;min-width:110px;text-align:left;vertical-align:top;
  white-space:normal;overflow-wrap:anywhere;word-break:normal;
  border:0;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.answer .table-scroll th{
  background:var(--mint);color:var(--green-dark);font-weight:700;
}
.answer .table-scroll tr>:last-child{border-right:0}
.answer .table-scroll tbody tr:last-child td{border-bottom:0}
.table-hint{
  display:flex;align-items:center;gap:6px;margin:0 0 14px;
  color:var(--muted);font-size:11px;line-height:1.5;
}
.table-hint .icon{font-size:17px}
.answer h1,.answer h2,.answer h3{
  font-size:17px;letter-spacing:0;margin:15px 0 9px;
}
.sources{
  border-top:1px solid var(--line);margin-top:14px;padding-top:12px;
  display:flex;gap:7px;flex-wrap:wrap;
}
.sources small{width:100%;font-weight:700;color:var(--muted)}
.source{
  font-size:11px;padding:5px 8px;border-radius:7px;
  background:var(--mint);text-decoration:none;
  overflow-wrap:anywhere;max-width:100%;
}
.message-tools{display:flex;gap:8px;margin-top:8px}
.message-tools button{
  display:flex;align-items:center;gap:6px;min-height:40px;
  padding:7px 10px;color:var(--green);background:transparent;
  border-radius:9px;font-size:11px;
}
.error .bubble{border-color:#efd3ca;background:#fff6f2;color:#8f3e26}
.loading{
  font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px;
}
.loading:before{
  content:"";height:8px;width:8px;background:var(--green);
  border-radius:50%;animation:pulse 1s infinite alternate;
}
.composer{flex-shrink:0;background:var(--bg);padding:10px 24px 12px}
.composer-inner{max-width:732px;margin:auto}
.input-wrap{
  display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);
  padding:8px;border-radius:20px;background:white;
  box-shadow:0 6px 25px #173f2010;
}
.input-wrap:focus-within{border-color:#69a88b}
.input-wrap textarea{
  resize:none;flex:1;min-width:0;max-height:120px;padding:11px 3px;
  border:0;background:transparent;outline:none;font-size:16px;line-height:1.5;
}
.input-wrap .icon-button{border:0;background:var(--mint);flex-shrink:0}
.input-wrap .send{background:var(--green);color:white}
.composer-hint{
  text-align:center;font-size:10px;color:var(--muted);margin:8px 0 0;
}
.card{
  background:white;border:1px solid var(--line);padding:22px;
  border-radius:var(--radius);margin-top:20px;
}
fieldset{padding:0;margin:0 0 25px;border:0;min-width:0}
legend{font-size:14px;font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.choice{
  display:inline-flex;align-items:center;gap:8px;padding:11px 13px;
  border:1px solid var(--line);border-radius:12px;
  font-size:12px;cursor:pointer;min-height:44px;
}
.choice:has(input:checked){
  background:var(--mint);border-color:#80b59a;color:var(--green);
}
.choice input{accent-color:var(--green);width:16px;height:16px;margin:0}
.full{width:100%}
.voice-page{text-align:center;max-width:620px}
.voice-page .eyebrow{margin-top:20px}
.voice-circle{
  width:112px;height:112px;margin:30px auto;border-radius:50%;
  display:grid;place-items:center;background:var(--green);
  color:white;box-shadow:0 0 0 15px var(--mint);
}
.voice-circle .icon{font-size:40px}
.voice-circle.recording{
  animation:pulse 1s infinite alternate;box-shadow:0 0 0 20px #c9ebd7;
}
.voice-text{
  width:100%;min-height:115px;resize:vertical;background:var(--bg);
  border:1px solid var(--line);border-radius:13px;
  padding:14px;font-size:16px;line-height:1.7;color:var(--ink);
}
.voice-label{
  text-align:left;display:block;font-size:12px;
  font-weight:700;margin-bottom:10px;
}
.dest-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;margin-top:22px;
}
.dest-card{
  text-align:left;padding:0;background:white;
  border:1px solid var(--line);border-radius:20px;
  overflow:hidden;color:var(--ink);
}
.dest-art{
  height:145px;background:linear-gradient(140deg,#d8ebdf,#eff6ec);
  display:grid;place-items:center;color:var(--green);overflow:hidden;
}
.dest-art .icon{font-size:56px}
.dest-copy{padding:18px}
.dest-copy h3{line-height:1.4;font-size:16px;margin:10px 0}
.dest-copy p{font-size:12px;margin:0}
.detail-title{font-size:32px}
.detail-tabs{
  display:flex;overflow:auto;border-bottom:1px solid var(--line);
  gap:12px;margin:22px 0 16px;
}
.detail-tabs button{
  white-space:nowrap;padding:13px 4px;min-height:46px;
  background:transparent;color:var(--muted);
  font-size:12px;border-bottom:2px solid transparent;
}
.detail-tabs button[aria-pressed=true]{
  color:var(--green);border-color:var(--green);font-weight:700;
}
#detail-body{min-height:100px}
.toast{
  position:fixed;z-index:100;left:50%;transform:translateX(-50%);
  top:85px;max-width:calc(100% - 32px);width:max-content;
  background:var(--ink);color:white;padding:13px 18px;
  border-radius:14px;font-size:12px;box-shadow:0 8px 30px #0002;
}
@keyframes pulse{to{opacity:.55}}
@media(min-width:760px){
  .header{padding-left:34px;padding-right:34px}
  .page{padding-top:32px}
  .home-intro{
    display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;
  }
  .hero{margin:0;min-height:325px;order:2}
  .home-copy h1{font-size:38px}
  .home-copy .actions{flex-direction:column}
  .nav{justify-content:center;gap:12px}
  .nav button{max-width:130px;font-size:11px}
}
@media(max-width:420px){
  .header{padding-left:18px;padding-right:18px;gap:12px}
  .hello-brand-name{font-size:19px}
  .page{padding:22px 18px 28px}
  .hero{min-height:200px}
  .actions .button{padding:12px;font-size:12px}
  .dest-grid{grid-template-columns:1fr}
  .dest-card{display:flex}
  .dest-card .dest-art{height:auto;width:100px;flex-shrink:0}
  .dest-copy{padding:15px}
  .composer{padding:8px 12px 10px}
  .card{padding:18px}
  .partners{padding:18px 12px}
  .partner-grid{gap:8px}
  .partner-image{height:54px}
  .partner-name{font-size:10px}
}
@media(max-width:340px){
  .header{padding-left:12px;padding-right:12px;gap:8px}
  .hello-brand-name{font-size:17px}
  .hello-brand-subtitle{font-size:10px}
  .language button{min-width:36px;padding:0 8px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;scroll-behavior:auto!important}
}
.source{max-width:100%;overflow-wrap:anywhere;white-space:normal;line-height:1.5}
</style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="hello-brand">
      <div class="hello-brand-title">
        <span class="hello-brand-name">Hallo Batam</span>
        <span class="hello-ai-badge">AI</span>
      </div>
      <small class="hello-brand-subtitle" data-t="brandSub">
        Asisten perjalanan Anda
      </small>
    </div>

    <div class="language" aria-label="Pilih bahasa / Select language">
      <button
        type="button"
        data-lang="ID"
        aria-label="Bahasa Indonesia"
        aria-pressed="true"
      >ID</button>
      <button
        type="button"
        data-lang="EN"
        aria-label="English"
        aria-pressed="false"
      >EN</button>
    </div>
  </header>

  <main id="main">
    <section class="page" id="home">
      <div class="home-intro">
        <div class="hero">
          <img src="image_02fa79.jpg" alt="" onerror="this.hidden=true">
          <div class="hero-caption">
            <span class="tag">
              <span class="icon" style="font-size:15px">location_on</span>
              Batam, Kepulauan Riau
            </span>
            <strong data-t="heroTitle"></strong>
            <p data-t="heroSub"></p>
          </div>
        </div>

        <div class="home-copy">
          <p class="eyebrow" data-t="eyebrow"></p>
          <h1 data-t="welcome"></h1>
          <p class="muted" data-t="welcomeSub"></p>
          <div class="actions">
            <button class="button primary" data-go="chat">
              <span class="icon">chat_bubble</span>
              <span data-t="start"></span>
            </button>
            <button class="button secondary" data-go="voice">
              <span class="icon">mic</span>
              <span data-t="useVoice"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="section-heading">
        <h3 data-t="inspiration"></h3>
        <span class="tag" data-t="try"></span>
      </div>
      <div class="prompt-list" id="home-prompts"></div>

      <div class="note">
        <strong data-t="personalTitle"></strong><br>
        <span data-t="personalSub"></span>
        <button class="text-button" data-go="prefs" data-t="setPrefs"></button>
      </div>

      <section class="partners" aria-labelledby="partners-title">
        <h2 class="partners-title" id="partners-title" data-t="partnersTitle">
          Kontributor 
        </h2>
        <ul class="partner-grid">
          <li class="partner-item">
            <div class="partner-image">
              <img src="./telyu" alt="Logo Telyu"
                width="100" height="68" loading="lazy" decoding="async">
            </div>
            <span class="partner-name"></span>
          </li>
          <li class="partner-item">
            <div class="partner-image">
              <img src="./btp" alt="Logo BTP"
                width="100" height="68" loading="lazy" decoding="async">
            </div>
            <span class="partner-name"></span>
          </li>
          <li class="partner-item">
            <div class="partner-image">
              <img src="./greentech" alt="Logo GreenTech"
                width="100" height="68" loading="lazy" decoding="async">
            </div>
            <span class="partner-name"></span>
          </li>
          <li class="partner-item">
            <div class="partner-image">
              <img src="./sth" alt="Logo STH"
                width="100" height="68" loading="lazy" decoding="async">
            </div>
            <span class="partner-name"></span>
          </li>
        </ul>
      </section>
    </section>

    <section class="page" id="chat" hidden>
      <div class="page-top">
        <h2 data-t="chat"></h2>
        <span class="tag">
          <span class="icon" style="font-size:16px">auto_awesome</span>
          Hallo Batam AI
        </span>

  async function startRecording() {

    const stopTracks=()=>stream?.getTracks().forEach(track=>track.stop());
    const current={abort(){cancelled=true;clearTimeout(hardTimer);clearTimeout(permissionTimer);aborter.abort();capture?.cancel();stopTracks();},stop(){if(stopping||!capture)return;stopping=true;recording=false;voiceStatus='transcribing';renderVoice();capture.stop();}};
    recognition=current;voiceStatus='starting';renderVoice();
    try {
      const audio={channelCount:{ideal:1},echoCancellation:true,noiseSuppression:true,autoGainControl:false};
      if(selectedMicrophone)audio.deviceId={exact:selectedMicrophone};
      const pending=navigator.mediaDevices.getUserMedia({audio,video:false});
      pending.then(s=>{if(cancelled)s.getTracks().forEach(t=>t.stop());},()=>{});
      stream=await Promise.race([pending,new Promise((_,reject)=>{permissionTimer=setTimeout(()=>{cancelled=true;reject(Object.assign(new Error('Permission timeout'),{name:'NotAllowedError'}));},20000);})]);
      clearTimeout(permissionTimer);if(cancelled||recognition!==current){stopTracks();return;}
      void refreshMicrophones(stream.getAudioTracks()[0]?.getSettings().deviceId);
      capture=await createAudioCapture(stream,(rms,peak)=>{if(cancelled||stopping)return;updateVoiceLevel(rms,peak);detector?.sample(rms,performance.now());},aborter.signal);
      if(cancelled||recognition!==current){capture.cancel();stopTracks();return;}
      detector=createSpeechPauseDetector(performance.now(),reason=>{noSpeech=reason==='no_speech';current.stop();});
      $('transcript').value='';capture.start();recording=true;voiceStatus='listening';renderVoice();
      hardTimer=setTimeout(()=>current.stop(),45000);
      for(const track of stream.getAudioTracks())track.onended=()=>current.stop();
      const raw=await capture.finished;clearTimeout(hardTimer);stopTracks();
      if(cancelled||recognition!==current)return;
      recording=false;
      if(noSpeech){voiceStatus='noSpeech';return;}
      voiceStatus='transcribing';renderVoice();deadlineTimer=setTimeout(()=>aborter.abort(),35000);
      const wav=await encodePcmWav(raw.samples,raw.sampleRate);if(cancelled||recognition!==current)return;
      setVoicePreview(wav);
      const result=await transcribeAudio(wav,aborter.signal,recordingLanguage);if(cancelled||recognition!==current)return;
      if(result.reviewRecommended){$('transcript').value='';voiceStatus='unclearSpeech';}

      if(recognition===current&&(!cancelled||error?.name==='NotAllowedError')){voiceStatus=voiceFailureKey(error);if(error?.name==='OverconstrainedError'){selectedMicrophone='';storage.set('hb_microphone_v1','');void refreshMicrophones();}}

      clearTimeout(hardTimer);clearTimeout(permissionTimer);clearTimeout(deadlineTimer);capture?.cancel();stopTracks();

  }

  function safeURL(value) {
    if (typeof value !== "string") return null;
    try {
      const url = new URL(value);
      return ["https:","http:"].includes(url.protocol) ? url.href : null;
    } catch {
      return null;
    }
  }


  // A random session bearer token is issued by the backend. No AI or admin keys are sent to the browser.
  let apiSession = null;
  let apiSessionPromise = null;
  function forgetApiSession() {
    apiSession = null;
    storage.set('hb_api_session_v1','');
  }
  async function apiFailure(response,language) {
    let details = {};
    try { details = await response.json(); } catch {}
    const error = new Error('HTTP ' + response.status);
    error.code = details.code || 'backend_unavailable';
    const messages = {
      rate_limit:['Demo sedang ramai. Tunggu sebentar lalu coba lagi.','The demo is busy. Please wait briefly and try again.'],
      ai_quota:['Kuota AI gratis sedang terbatas. Silakan coba lagi nanti.','The free AI quota is temporarily unavailable. Please try again later.'],
      session_busy:['Pertanyaan sebelumnya masih diproses. Tunggu sebentar.','Your previous question is still being processed. Please wait.'],
      invalid_message:['Pertanyaan harus berisi 1–2.000 karakter.','Your question must contain 1–2,000 characters.'],
      ai_not_configured:['Asisten sementara belum tersedia. Silakan coba lagi nanti.','The assistant is temporarily unavailable. Please try again later.']
    };
    const pair = messages[error.code];
    if (pair) error.userMessage = pair[language === 'en' ? 1 : 0];
    console.warn('Hallo Batam request failed',response.status,error.code);
    return error;
  }
  async function getApiSession(signal,language) {
    if (apiSession) return apiSession;
    if (!apiSessionPromise) {
      apiSessionPromise = (async () => {
        let saved = null;
        try { saved = JSON.parse(storage.get('hb_api_session_v1','null')); } catch {}
        if (saved && typeof saved.session_token === 'string' && /^[a-f0-9]{64}$/.test(saved.session_token)) {
          apiSession = saved;
          return saved;
        }
        const response = await fetch(API_URL,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({action:'session'}),signal
        });
        if (!response.ok) throw await apiFailure(response,language);
        const result = await response.json();
        if (typeof result.session_token !== 'string' || !/^[a-f0-9]{64}$/.test(result.session_token)) throw new Error('Invalid session response');
        apiSession = {session_id:result.session_id,session_token:result.session_token};
        storage.set('hb_api_session_v1',JSON.stringify(apiSession));
        sessionId = result.session_id;
        storage.set('session_id',sessionId);
        return apiSession;
      })().finally(() => {apiSessionPromise = null;});
    }
    return apiSessionPromise;
  }
  function apiRequestId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b,n => n.toString(16).padStart(2,'0')).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  async function fetchChat(payload,signal) {
    if (!payload.request_id) payload.request_id = apiRequestId();
    for (let attempt=0;attempt<2;attempt++) {
      const session = await getApiSession(signal,payload.language);
      const response = await fetch(API_URL,{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer ' + session.session_token},
        body:JSON.stringify({...payload,session_id:session.session_id}),signal
      });
      if (response.status === 401 && attempt === 0) {forgetApiSession();continue;}
      return response;
    }
    throw new Error('Session unavailable');
  }

  function addSources(bubble,sources,language) {
    if (!Array.isArray(sources) || !sources.length) return;
    const wrap = node('div','sources');
    wrap.append(node('small','',t('sources',language)));
    const seen = new Set();
    for (const source of sources.slice(0,20)) {
      if (!source) continue;
      const object = typeof source === 'object';
      const href = safeURL(object ? (source.url || source.link) : source);
      if (!href || !href.startsWith('https:') || seen.has(href + (object ? source.title : ''))) continue;
      let label = object ? (source.title || source.publisher || new URL(href).hostname) : new URL(href).hostname;
      if (/data_wisata|\.txt\b|materi proyek|belum diverifikasi|project material|not independently verified/i.test(String(label))) label = new URL(href).hostname;
      const item = node('a','source',String(label));
      item.href = href;
      item.target = '_blank';
      item.rel = 'noopener noreferrer';
      if (object && /^\d{4}-\d{2}-\d{2}$/.test(source.checked_at || '')) {
        const date = new Date(source.checked_at + 'T00:00:00Z');
        if (Number.isFinite(date.getTime())) {
          const locale = language === 'EN' || (!language && lang === 'EN') ? 'en-GB' : 'id-ID';
          item.title = (locale === 'en-GB' ? 'Source checked: ' : 'Sumber diperiksa: ') + date.toLocaleDateString(locale,{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
          item.setAttribute('aria-label',String(label) + '. ' + item.title);
        }
      }
      seen.add(href + (object ? source.title : ''));
      wrap.append(item);
    }
    if (wrap.children.length > 1) bubble.append(wrap);
  }

  function refreshTables() {
    document.querySelectorAll(".table-scroll").forEach(region => {
      if (!region.clientWidth) return;
      const overflow = region.scrollWidth > region.clientWidth + 1;
      region.nextElementSibling.hidden = !overflow;
      region.tabIndex = overflow ? 0 : -1;
      region.setAttribute("aria-label",t("tableLabel"));
    });
  }

  const tableObserver = "ResizeObserver" in window
    ? new ResizeObserver(refreshTables)
    : null;

  if (!tableObserver) {
    window.addEventListener("resize",refreshTables);
  }

  function prepareTables(answer) {
    answer.querySelectorAll("table").forEach(table => {
      const region = node("div","table-scroll");
      region.setAttribute("role","region");
      region.setAttribute("aria-label",t("tableLabel"));

      table.before(region);
      region.append(table);

      const hint = node("div","table-hint");
      hint.hidden = true;

      const icon = node("span","icon","swipe");
      icon.setAttribute("aria-hidden","true");

      const label = node("span","",t("tableHint"));
      label.dataset.t = "tableHint";

      hint.append(icon,label);
      region.after(hint);

      if (tableObserver) {
        tableObserver.observe(region);
        tableObserver.observe(table);
      }
    });

    requestAnimationFrame(refreshTables);
  }

  function showAnswer(data,requestLanguage) {
    const {wrapper,bubble} = addMessage(
      "assistant",undefined,requestLanguage
    );

    const answer = node("div","answer");

    if (window.marked && window.DOMPurify) {
      answer.innerHTML = DOMPurify.sanitize(marked.parse(data.response), {
        USE_PROFILES:{html:true},
        FORBID_TAGS:[
          "img","video","audio","iframe","form","input","button","style"
        ],
        FORBID_ATTR:["style"]
      });

      answer.querySelectorAll("a").forEach(link => {
        const href = safeURL(link.getAttribute("href"));
        if (href) {
          link.href = href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        } else {
          link.removeAttribute("href");
        }
      });
    } else {
      answer.textContent = data.response;
      answer.style.whiteSpace = "pre-wrap";
    }

    const speechText = answer.textContent;
    prepareTables(answer);
    bubble.append(answer);
    addSources(bubble,data.sources,requestLanguage);

    const controls = node("div","message-tools");
    const button = node("button","",t("listen"));
    button.type = "button";
    button.dataset.listen = "true";

    button.onclick = () => {
      if (!("speechSynthesis" in window)) {
        toast(t("ttsError"));
        return;
      }

      if (speaking?.button === button) {
        cancelSpeech();
        return;
      }

      cancelSpeech();

      const utterance = new SpeechSynthesisUtterance(speechText);
      const responseLanguage =
        String(data.language || requestLanguage).toLowerCase();

      utterance.lang = responseLanguage.startsWith("en") ? "en-US" : "id-ID";
      speaking = {button,utterance};
      button.textContent = t("stop");

      utterance.onend = () => {
        if (speaking?.utterance === utterance) {
          button.textContent = t("listen");
          speaking = null;
        }
      };

      utterance.onerror = () => {
        if (speaking?.utterance === utterance) {
          button.textContent = t("listen");
          speaking = null;
          toast(t("ttsError"));
        }
      };

      window.speechSynthesis.speak(utterance);
    };

    controls.append(button);
    wrapper.append(controls);
    return wrapper;
  }

  function buildPayload(text,language) {
    const i = language === "ID" ? 0 : 1;
    const selected = prefs.interests
      .map(value => interests[value][i])
      .join(", ");

    const parts = [];
    if (selected) {
      parts.push((i === 0 ? "Minat: " : "Interests: ") + selected);
    }

    if (prefs.duration !== "flexible") {
      parts.push(
        (i === 0 ? "Durasi: " : "Duration: ") +
        durations[prefs.duration][i]
      );
    }

    const context = parts.length
      ? (i === 0
          ? "\n\nPreferensi perjalanan pengguna (gunakan jika relevan): "
          : "\n\nUser travel preferences (use when relevant): ") +
        parts.join("; ")
      : "";

    return {
      message:text + context,
      language:language.toLowerCase(),
      session_id:sessionId
    };
  }

  async function submit(text,retry = null) {
    text = String(text || "").trim();
    if (!text || busy) return;

    busy = true;
    cancelSpeech();

    const requestLanguage = retry?.language || lang;
    const payload = retry?.payload || buildPayload(text,requestLanguage);
    showPage("chat");

    if (!retry) {
      if ($("input").value.trim() === text) {
        $("input").value = "";
        $("input").style.height = "auto";
      }
      addMessage("user",text,requestLanguage);
    }

    const loading = node("div","loading",t("thinking",requestLanguage));
    loading.setAttribute("role","status");

    if (retry?.anchor?.isConnected) retry.anchor.replaceWith(loading);
    else $("messages").append(loading);

    updateSend();
    scrollChat();

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(),60000);

    try {
      const response = await fetchChat(payload,controller.signal);

      if (!response.ok) throw await apiFailure(response,requestLanguage);

      const data = await response.json();
      if (typeof data.response !== "string" || !data.response.trim()) {
        throw new Error("Invalid response");
      }

      const answerWrapper = showAnswer(data,requestLanguage);
      loading.replaceWith(answerWrapper);
    } catch (error) {
      const result = addMessage(
        "error",
        error.userMessage || t(
          error.name === "AbortError" ? "timeout" : "failed",
          requestLanguage
        ),
        requestLanguage
      );

      const button = node(
        "button","button secondary",t("retry",requestLanguage)
      );

      loading.replaceWith(result.wrapper);
      button.dataset.retry = "true";
      button.style.marginTop = "12px";

      button.onclick = () => {
        if (busy) return;
        submit(text,{
          payload,
          language:requestLanguage,
          anchor:result.wrapper
        });
      };

      result.bubble.append(document.createElement("br"),button);
    } finally {
      clearTimeout(timer);
      busy = false;
      updateSend();
      scrollChat();
    }
  }

  $("transcript").oninput = renderVoice;

  $('microphone-select').onchange=()=>{selectedMicrophone=$('microphone-select').value;storage.set('hb_microphone_v1',selectedMicrophone);clearVoicePreview();};
  navigator.mediaDevices?.addEventListener?.('devicechange',()=>void refreshMicrophones());
  window.addEventListener('pagehide',clearVoicePreview);
  void refreshMicrophones();

  $("prefs-form").onsubmit = event => {
    event.preventDefault();

    prefs = {
      interests:Array.from(
        document.querySelectorAll('input[name="interest"]:checked')
      ).map(el => el.value),
      duration:
        document.querySelector('input[name="duration"]:checked')?.value ||
        "flexible"
    };

    toast(t(
      storage.set("wb_preferences",JSON.stringify(prefs))
        ? "saved" : "temporary"
    ));
  };

  $("ask-dest").onclick = () => {
    submit(t("askPlace") + local(places[selectedPlace].name));
  };

  document.addEventListener("visibilitychange",() => {
    if (document.hidden) {
      abortRecording();
      cancelSpeech();
    }
  });

  renderChoices();
  translate();

  document.querySelectorAll(".icon").forEach(icon => {
    icon.setAttribute("aria-hidden","true");
  });

  showPage("home");
});
</script>
</body>
</html>
